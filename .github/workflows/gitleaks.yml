# Manual only (owner's call, 2026-10-13: Actions minutes are a budget). To run automatically again, replace the on: block with:
#   on:
#     push:
#     pull_request:

name: gitleaks

# Server-side secret-scanning backstop. The local pre-commit hook
# (.githooks/pre-commit) is the first line of defense, but it only runs on a
# developer's machine and can be skipped with `git commit --no-verify`. This
# workflow runs on GitHub for every push and pull request — it can't be
# bypassed, so a leaked credential fails the check before it can be merged.
#
# Uses the same .gitleaks.toml at the repo root as the local hook, so rules and
# allowlists stay in one place.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole commit history, not just the tip

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --redact --no-banner --verbose
