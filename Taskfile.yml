# https://taskfile.dev

version: "3"

dotenv: [".env"]

includes:
  docker:
    taskfile: .docker/Taskfile.yml
    dir: ./.docker
  scripts:
    taskfile: scripts/Taskfile.yml
    dir: ./scripts
  db:
    taskfile: src/integrations/drizzle/Taskfile.yml
    dir: .

tasks:
  dev:
    desc: run vite dev (foreground), tee logs to tmp/dev.log
    cmds:
      - mkdir -p tmp
      - pnpm dev 2>&1 | tee tmp/dev.log

  dev:bg:
    desc: run vite dev in background, logs → tmp/dev.log (pid → tmp/dev.pid)
    cmds:
      - mkdir -p tmp
      - |
        if [ -f tmp/dev.pid ] && kill -0 "$(cat tmp/dev.pid)" 2>/dev/null; then
          echo "dev already running (pid $(cat tmp/dev.pid)). Run 'task dev:stop' first."
          exit 1
        fi
        : > tmp/dev.log
        nohup pnpm dev > tmp/dev.log 2>&1 &
        echo $! > tmp/dev.pid
        echo "started pid $(cat tmp/dev.pid). tail: tmp/dev.log"

  dev:stop:
    desc: stop background vite dev started via dev:bg
    cmds:
      - |
        if [ -f tmp/dev.pid ]; then
          PID=$(cat tmp/dev.pid)
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" && echo "killed $PID"
          else
            echo "pid $PID not running"
          fi
          rm -f tmp/dev.pid
        else
          echo "no tmp/dev.pid"
        fi

  dev:logs:
    desc: tail tmp/dev.log
    cmds:
      - tail -f tmp/dev.log

  dev:portless:
    desc: run vite via portless (dynamic port) → https://volt.localhost — logs → tmp/dev.log
    cmds:
      - mkdir -p tmp
      - portless 2>&1 | tee tmp/dev.log

  dev:guard:
    desc: "run portless dev with auto-restart on crash (Ctrl-C to stop). USE THIS day-to-day."
    cmds:
      - bash dev-guard.sh

  portless:trust:
    desc: "install portless local CA into the system trust store (one-time, needs sudo)"
    cmds:
      - portless trust

  portless:up:
    desc: "start the portless HTTPS proxy daemon (port 443, auto-elevates with sudo)"
    cmds:
      - portless proxy start

  portless:down:
    desc: stop the portless HTTPS proxy daemon
    cmds:
      - portless proxy stop

  portless:url:
    desc: "print the fixed dev URL for this app (https://volt.localhost)"
    cmds:
      - portless get volt

  portless:list:
    desc: show active portless routes
    cmds:
      - portless list

  portless:prune:
    desc: kill orphaned dev servers left behind by crashed sessions
    cmds:
      - portless prune

  portless:clean:
    desc: "remove portless state, trust entry, and hosts block (full reset)"
    cmds:
      - portless clean

  typecheck:
    desc: type-check the whole project with tsc (no emit)
    cmds:
      - pnpm exec tsc --noEmit

  check:
    desc: biome check (lint + format) the source tree
    cmds:
      - pnpm exec biome check src

  build:
    desc: production build (vite + nitro), regenerates the route tree
    cmds:
      - pnpm build

  screenshots:
    desc: "capture demo screenshots → volt/screenshots (start the app first, e.g. task dev:guard)"
    cmds:
      - bash scripts/screenshots.sh

  # ── branding: regenerate the PWA/favicon icon set from one source image ───
  # Drop a square source (≥512×512) at public/logo-source.png, then run this.
  # See /demo/branding in the app for the full replace-the-branding guide.
  branding:gen:
    desc: Generate public/images/icon-{192,512,180x180}.png from public/logo-source.png
    cmds:
      - |
        SRC="public/logo-source.png"
        if [ ! -f "$SRC" ]; then
          echo "Missing $SRC — put a square image (>=512x512) there first." >&2
          exit 1
        fi
        sips -z 192 192 "$SRC" --out public/images/icon-192.png
        sips -z 512 512 "$SRC" --out public/images/icon-512.png
        sips -z 180 180 "$SRC" --out public/images/icon-180x180.png
        echo "Generated icon-192 / icon-512 / icon-180x180 in public/images/"

  # ── gqlkit: typed GraphQL SDK codegen (replaces graphql-codegen) ──────────
  # The `gqlkit` + `gqlkit-sdl` Go binaries must be on PATH.
  # Install: curl -sL https://raw.githubusercontent.com/khanakia/gqlkit/main/gqlkit/install.sh | sh
  gqlkit:fetch:
    desc: Fetch the GraphQL SDL from the live API via introspection → src/scripts/api/schema-introspected.graphql
    cmds:
      - gqlkit-sdl fetch --url "${VITE_API_URL:-https://sync-api.localhost}/api/admin/v1/query_playground?pkey=${GQL_PKEY:-1234}" -o src/scripts/api/schema-introspected.graphql

  gqlkit:gen:
    desc: Generate the typed TypeScript SDK at src/generated/sdk from the fetched SDL
    cmds:
      - gqlkit generate-ts --schema src/scripts/api/schema-introspected.graphql --output src/generated/sdk --config src/scripts/api/config.jsonc

  gqlkit:all:
    desc: Fetch schema then regenerate the SDK in one shot (the codegen entrypoint)
    cmds:
      - task: gqlkit:fetch
      - task: gqlkit:gen

  # ── secret scanning (gitleaks + regex fallback pre-commit hook) ───────────
  hooks:install:
    desc: Activate the .githooks/pre-commit secret scanner for this clone (also installs gitleaks if missing)
    cmds:
      - git config --local core.hooksPath .githooks
      - echo "✓ git hooksPath = .githooks (pre-commit secret scanner active)"
      - |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "⚠ gitleaks not installed — installing via brew for stronger detection…"
          if command -v brew >/dev/null 2>&1; then
            brew install gitleaks
          else
            echo "  brew not available — install gitleaks manually:"
            echo "  https://github.com/gitleaks/gitleaks#installing"
            exit 1
          fi
        else
          echo "✓ gitleaks $(gitleaks version) — primary scanner active"
        fi

  secrets:scan:
    desc: Run gitleaks against the full repo history (slow but thorough)
    cmds:
      - gitleaks detect --redact --no-banner --verbose

  secrets:scan:staged:
    desc: Run gitleaks against the currently staged diff only (fast)
    cmds:
      - gitleaks protect --staged --redact --no-banner --verbose
