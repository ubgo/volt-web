"""
A recurring schedule for a workflow inside the caller's workspace.
Backed by wfr_workflow_schedules; Hatchet engine fires the actual
cron tick via the cronUtc field.

Workspace timezone (auth_workspaces.timezone) is the source of truth
for "what wall-clock time does this fire?" — cronLocal is what the
operator typed, cronUtc is the server-computed UTC equivalent.

DST: in DST-observing workspaces cronUtc can drift up to 1 hour for
~7 months/year. Accepted v1 trade-off; a future maintenance cron will
recompute at DST boundaries.
"""
type WfWorkflowSchedule {
	id: ID!
	"""
	Workspace owning this schedule. Stamped from auth ctx — never
	     accepted as input.
	"""
	workspaceId: String!
	"""
	Fully-qualified workflow name. Matches WfrWorkflowSpec.name in
	     the catalog.
	"""
	workflowName: String!
	"""
	5-field crontab in the workspace's wall-clock time. What the
	     operator typed.
	"""
	cronLocal: String!
	"""
	5-field crontab in UTC. Computed from cronLocal + workspace.timezone.
	     This is what Hatchet's engine fires on.
	"""
	cronUtc: String!
	"""
	JSON payload passed to the workflow's first step at fire time.
	     NULL = empty {}.
	"""
	input: JSON
	"""
	When false, the schedule is paused — Hatchet has it
	     deregistered. Resume re-registers it.
	"""
	enabled: Boolean!
	"""
	Optional @N workflow-version pin per ADR-V3-010. NULL = fire at
	     @latest at each tick.
	"""
	versionPin: Int
	"""
	Opaque Engine (Hatchet) cron registration id. NULL when paused OR when
	     the registration failed (transient — Pause/Resume recovers).
	"""
	engineCronId: String
	"""
	Last known fire time (best-effort). Updated by the run-start
	     hook in chunk 3 wiring.
	"""
	lastFiredAt: Time
	"""
	Next predicted fire time (UI estimate via robfig/cron). Hatchet
	     owns actual firing.
	"""
	nextFireAt: Time
	"""
	Free-form actor that created the schedule (format `<kind>:<id>`,
	     e.g. user:usr_xxx).
	"""
	createdBy: String!
	createdAt: Time!
	updatedAt: Time!
}

input WfrScheduleWorkflowInput {
	workflowName: String!
	cronLocal: String!
	input: JSON
	enabled: Boolean = true
	versionPin: Int
}

